[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "sqlalchemy>=2.0.51",
]

[tool.ruff.lint]
extend-select= ["UP","I","B"]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=9.1.1",
]


# pytestは、テストファイルごとに、親ディレクトリを上にたどり、
# __init__.pyがない最初のディレクトリをsys.pathに追加する、という挙動をする
# これは、flask, gunicornなどのコマンドラインを実行した時に、cwd を自動で
# 追加してくれるという挙動とは異なる。よって、以下の設定が必要。
[tool.pytest.ini_options]
pythonpath = ["."]
