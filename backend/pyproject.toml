[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "sqlalchemy>=2.0.51",
]

[tool.ruff.lint]
extend-select= ["UP","I","B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# pytest が自動で sys.path に足すのは cwd ではなく「テストファイルが置かれているディレクトリ」なので以下の設定が必要。
[tool.pytest.ini_options]
pythonpath = ["."]
